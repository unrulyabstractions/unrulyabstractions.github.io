<head>
    <meta charset="utf-8">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

    <style>

            --color-background: rgba(215, 130, 110, 0.85);
            --color-text-primary: rgba(255, 255, 255, 0.95);
            --color-text-link: rgba(255, 255, 255, 0.85);

            --color-text-label: rgba(255, 255, 255, 0.7);
            --color-text-muted: rgba(255, 255, 255, 0.6);
            --color-border-item: rgba(255, 255, 255, 0.1);
            --font-size-page-title: 2.5rem;
            --font-weight-page-title: 600;
            --letter-spacing-page-title: 2px;
            --margin-page-title-bottom: 3rem;
            --font-size-paper-link: 1.15rem;
            --font-weight-paper-link: 400;
            --font-size-category-label: 0.65rem;
            --font-weight-category-label: 500;
            --letter-spacing-category-label: 1px;
            --opacity-category-label: 0.6;
            --font-size-date-label: 0.55rem;
            --font-weight-date-label: 400;
            --opacity-date-label: 0.5;
            --font-size-back-button: 1rem;
            --font-weight-back-button: 400;
            --padding-back-button-vertical: 0.5rem;
            --padding-back-button-horizontal: 1rem;
            --border-radius-back-button: 30%;
            --max-width-container: 800px;
            --padding-container-vertical: 4rem;
            --padding-container-horizontal: 2rem;
            --gap-paper-list: 1.5rem;
            --padding-paper-item-vertical: 0.75rem;
            --padding-paper-item-horizontal: 0;
            --gap-paper-item: 2rem;
            --gap-paper-meta: 0.3rem;
            --min-width-paper-meta: 150px;
            --position-back-button-top: 2rem;
            --position-back-button-left: 2rem;
            --border-width-paper-item: 1px;
            --gradient-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.08) 100%);
            --gradient-smudge-base: radial-gradient(ellipse 120% 100% at 45% 50%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.10) 20%, rgba(255, 255, 255, 0.04) 40%, rgba(255, 255, 255, 0.01) 60%, rgba(255, 255, 255, 0) 75%);
            --gradient-smudge-hover: radial-gradient(ellipse 120% 100% at 45% 50%, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.14) 20%, rgba(255, 255, 255, 0.06) 40%, rgba(255, 255, 255, 0.02) 60%, rgba(255, 255, 255, 0) 75%);
            --blur-smudge: 1.5px;
            --duration-hover: 0.2s;
            --duration-hover-slow: 0.3s;
            --translate-hover-link: 4px;
            --translate-hover-back-button: -3px;
            --font-family-primary: 'Roboto Mono', 'Atkinson Hyperlegible', monospace;
            --font-family-secondary: 'JetBrains Mono', 'Roboto Mono', monospace;
            --breakpoint-tablet: 768px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; hyphens: none; -webkit-hyphens: none; -moz-hyphens: none; -ms-hyphens: none; }
        html { scroll-behavior: smooth; }
        html, body { min-height: 100vh; background-color: var(--color-background); overflow-y: auto; font-family: var(--font-family-primary); color: var(--color-text-primary); }
        .container { max-width: var(--max-width-container); margin: 0 auto; padding: var(--padding-container-vertical) var(--padding-container-horizontal); display: flex; flex-direction: column; align-items: center; }
        .back-button { position: fixed; top: var(--position-back-button-top); left: var(--position-back-button-left); color: var(--color-text-link); text-decoration: none; font-size: var(--font-size-back-button); font-weight: var(--font-weight-back-button); padding: var(--padding-back-button-vertical) var(--padding-back-button-horizontal); border: none; border-radius: var(--border-radius-back-button); background: var(--gradient-smudge-base); transition: all var(--duration-hover-slow) ease; font-family: var(--font-family-primary); filter: none; z-index: 1; white-space: nowrap; }
        .back-button::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: var(--border-radius-back-button); background: var(--gradient-smudge-base); filter: blur(var(--blur-smudge)); z-index: -1; }
        .back-button:hover { background: var(--gradient-smudge-hover); color: var(--color-text-primary); transform: translateX(var(--translate-hover-back-button)); }
        .bottom-left-icon { position: fixed; bottom: 4rem; left: 4rem; height: 240px; width: auto; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)); }
        .back-button:focus { outline: none; }
        .page-title { font-size: var(--font-size-page-title); font-weight: var(--font-weight-page-title); letter-spacing: var(--letter-spacing-page-title); margin-bottom: var(--margin-page-title-bottom); font-family: var(--font-family-primary); text-align: center; }
        .paper-list { list-style: none; width: 100%; display: flex; flex-direction: column; gap: var(--gap-paper-list); }
        .paper-item { opacity: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: var(--gap-paper-item); padding: var(--padding-paper-item-vertical) var(--padding-paper-item-horizontal); border-bottom: var(--border-width-paper-item) solid var(--color-border-item); }
        .paper-link { color: var(--color-text-link); text-decoration: none; font-size: var(--font-size-paper-link); font-weight: var(--font-weight-paper-link); transition: all var(--duration-hover) ease; cursor: pointer; font-family: var(--font-family-primary); flex: 1; word-break: normal; overflow-wrap: normal; hyphens: none; white-space: normal; }
        .paper-link:hover { color: var(--color-text-bright); transform: translateX(var(--translate-hover-link)); }
        .paper-meta { display: flex; flex-direction: column; align-items: flex-end; gap: var(--gap-paper-meta); min-width: var(--min-width-paper-meta); }
        .category-label { font-size: var(--font-size-category-label); font-weight: var(--font-weight-category-label); opacity: var(--opacity-category-label); text-transform: uppercase; letter-spacing: var(--letter-spacing-category-label); color: var(--color-text-label); font-family: var(--font-family-secondary); text-align: right; white-space: nowrap; }
        .date-label { font-size: var(--font-size-date-label); font-weight: var(--font-weight-date-label); opacity: var(--opacity-date-label); color: var(--color-text-muted); font-family: var(--font-family-secondary); text-align: right; white-space: nowrap; }
        .slides-link { font-size: 0.55rem; font-weight: 300; opacity: 0.6; color: var(--color-text-link); text-decoration: none; font-family: var(--font-family-secondary); text-align: right; white-space: nowrap; transition: opacity var(--duration-hover) ease; display: block; margin-top: 0.3rem; }
        .slides-link:hover { opacity: 0.9; color: var(--color-text-bright); }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--gradient-overlay); pointer-events: none; }
        @media (max-width: 768px) {
            :root { --padding-container-vertical: 3rem; --padding-container-horizontal: 1.5rem; --position-back-button-top: 1rem; --position-back-button-left: 1rem; --font-size-back-button: 0.9rem; --padding-back-button-vertical: 0.4rem; --padding-back-button-horizontal: 0.8rem; --font-size-page-title: 2rem; --font-size-paper-link: 1.1rem; }
            .paper-item { flex-direction: column; gap: 0.5rem; align-items: flex-start; }
            .paper-meta { align-items: flex-start; min-width: auto; }
            .category-label, .date-label, .slides-link { text-align: left; }
            .bottom-left-icon { position: static; display: block; margin: 16rem auto 4rem auto; max-width: 60%; height: auto; max-height: 180px; }
            .container { padding-bottom: 0; margin-bottom: 0; }
            .page-title { margin-top: 4rem; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">← home</a>

    <div class="container">
        <h1 class="page-title">llm social bias</h1>
        <ul class="paper-list" id="paperList">
            <!-- Entries will be loaded dynamically -->
        </ul>
    </div>

    <img src="" alt="Icon" class="bottom-left-icon" id="bottomLeftIcon">

    <script>
        const TOPIC = 'llm-bias';

        (function() {
            const cacheBust = Date.now() + '_' + Math.random().toString(36).substring(2, 15);
            const iconEl = document.getElementById('bottomLeftIcon');
            if (iconEl) {
                iconEl.src = `img/icon.svg?v=${cacheBust}&_=${Date.now()}`;
            }
        })();

        async function loadEntries() {
            const list = document.getElementById('paperList');
            let entries = [];

            try {
                const response = await fetch('./config/content.json', { cache: 'no-store' });
                if (response.ok) {
                    const contentData = await response.json();
                    const papers = contentData.papers || [];
                    const notes = contentData.notes || [];
                    entries = [...papers, ...notes].filter(item => item && item.topic === TOPIC);
                }
            } catch (error) {
                console.error('Failed to load entries:', error);
            }

            entries.sort(sortByDateDescending);

            entries.forEach(entry => {
                const listItem = document.createElement('li');
                listItem.className = 'paper-item';

                const link = document.createElement('a');
                if (entry.url) {
                    link.href = entry.url;
                } else if (entry.filename) {
                    link.href = `./pdfs/${entry.filename}.pdf?v=${Date.now()}`;
                }
                link.className = 'paper-link';
                link.textContent = entry.displayName || entry.filename || entry.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                const meta = document.createElement('div');
                meta.className = 'paper-meta';

                const categoryLabel = document.createElement('div');
                categoryLabel.className = 'category-label';
                categoryLabel.textContent = entry.category || 'uncategorized';
                meta.appendChild(categoryLabel);

                if (entry.date) {
                    const dateLabel = document.createElement('div');
                    dateLabel.className = 'date-label';
                    dateLabel.textContent = formatDisplayDate(entry.date);
                    meta.appendChild(dateLabel);
                }

                if (entry.slides && typeof entry.slides === 'string' && entry.slides.trim()) {
                    const slidesLink = document.createElement('a');
                    slidesLink.className = 'slides-link';
                    slidesLink.textContent = 'also as slides';
                    slidesLink.href = entry.slides;
                    slidesLink.target = '_blank';
                    slidesLink.rel = 'noopener noreferrer';
                    meta.appendChild(slidesLink);
                }

                listItem.appendChild(link);
                listItem.appendChild(meta);
                list.appendChild(listItem);
            });

            applyTextScaling();
        }

        function applyTextScaling() {
            const links = document.querySelectorAll('.paper-link');
            links.forEach(link => {
                const computedStyle = window.getComputedStyle(link);
                const originalFontSize = parseFloat(computedStyle.fontSize);
                const lineHeight = parseFloat(computedStyle.lineHeight);
                const tolerance = 1.5;
                const isSingleLine = link.scrollHeight <= (lineHeight * tolerance);
                if (!isSingleLine) {
                    let currentFontSize = originalFontSize;
                    const minFontSize = originalFontSize * 0.85;
                    const step = 0.5;
                    while (link.scrollHeight > (lineHeight * tolerance) && currentFontSize > minFontSize) {
                        currentFontSize -= step;
                        link.style.fontSize = `${currentFontSize}px`;
                        if (currentFontSize <= minFontSize) break;
                    }
                }
            });
        }

        function randomizeButtonSmudge() {
            const button = document.querySelector('.back-button');
            if (button) {
                const randomBlur = 1.2 + Math.random() * 0.8;
                const randomEllipseX = 110 + Math.random() * 20;
                const randomEllipseY = 90 + Math.random() * 20;
                const randomPosX = 40 + Math.random() * 15;
                const randomPosY = 45 + Math.random() * 10;
                button.style.setProperty('--blur-smudge', `${randomBlur}px`);
                const gradient = `radial-gradient(ellipse ${randomEllipseX}% ${randomEllipseY}% at ${randomPosX}% ${randomPosY}%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.10) 20%, rgba(255, 255, 255, 0.04) 40%, rgba(255, 255, 255, 0.01) 60%, rgba(255, 255, 255, 0) 75%)`;
                button.style.background = gradient;
                button.style.setProperty('--gradient-smudge-base', gradient);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadEntries();
            randomizeButtonSmudge();
        });

        window.addEventListener('resize', applyTextScaling);

        function sortByDateDescending(a, b) {
            return getSortTimestamp(b) - getSortTimestamp(a);
        }

        function getSortTimestamp(entry) {
            const raw = entry && entry.date ? entry.date : null;
            if (!raw) return 0;
            if (typeof raw === 'string') {
                const normalized = raw.trim().toLowerCase();
                if (normalized === 'ongoing' || normalized === 'current') {
                    return 0;
                }
            }
            const parsed = Date.parse(raw);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function formatDisplayDate(value) {
            if (!value) return '';
            if (typeof value === 'string') {
                const normalized = value.trim();
                // Bare YYYY-MM-DD parses as UTC midnight, which reads back as the
                // previous day in western timezones. Build it from its parts instead.
                const parts = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(normalized);
                if (parts) {
                    const local = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
                    return local.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
                const parsed = Date.parse(normalized);
                if (Number.isFinite(parsed)) {
                    return new Date(parsed).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                }
                return normalized;
            }
            if (value instanceof Date && !Number.isNaN(value.getTime())) {
                return value.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            return String(value);
        }
    </script>
</body>
</html>
